<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css"> <!-- Link para o arquivo CSS externo -->
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="menu">
        <img id="logo" src="img_cadastro/Sob1.png" alt="Logo">
            <nav>
                <a href="/Site-E-commerce---Bug-Busters/tudo/produtos/produtos.html">Vestidos</a>
                <a href="#Colecoes">Coleções</a>
                <a href="#Agendamentos">Agendamentos</a>
            </nav>
            <nav class="icons">
                <a href="/Site-E-commerce---Bug-Busters/tudo/cadastro-login/login.html" target="_blanck">
                        <img src="img_cadastro/login.png"
                        width="20px"
                        title="login"
                        alt="login"
                    />
                    </a>
                <a href="/Site-E-commerce---Bug-Busters/tudo/carrinho/carrinho.html" target="_blanck">
                    <img src="img_cadastro/carrinho.png"
                    width="20px"
                    title="Carrinho"
                    alt="Carrinho"
                />
                </a>
            </nav>
        </div>
    

    <!-- CONTEÚDO PRINCIPAL DIVIDIDO EM DUAS PARTES -->
    <main class="container">
        <!-- IMAGEM À ESQUERDA -->
        <div class="imagem-esquerda">
            <img src="img_login/fundo-login.jpg" alt="Imagem de mãos com alianças">
            <a href="home.html" class="voltar-btn">← Voltar à página inicial</a>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div class="formulario-login">
            <h2>LOGIN</h2> <br><br><br><br><br>
            <form action="#" method="post">
                <label class="texto_email" for="email">E-mail:</label> <br>
                <input type="email" id="email" name="email" required>

                <label class="texto_senha" for="senha">Senha:</label> <br>
                <input type="password" id="senha" name="senha" required>

                <button type="submit" class="entrar-btn">Entrar</button> <br> <br>
            </form>

            <p class="criar-conta-texto">Não possui uma conta?</p> <br>
            <a href="cadastro.html" class="criar-conta-btn">Criar conta</a>
        </div>
    </main>

</body>
</html>
