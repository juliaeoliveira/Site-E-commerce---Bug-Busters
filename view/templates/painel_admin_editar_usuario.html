<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sob Véu - Editar Usuário</title>
    <link rel="stylesheet" href="/static/css/painel_usuario_editar_usuario.css"/>
  </head>
  <body>
    <div class="container">
      <h2>Editar Meus Dados</h2>
      <form
        id="formEditar"
        action="/usuario/admin/editar_usuario"
        method="post"
      >
        <label for="nome_cliente">Nome Completo:</label>
        <input
          type="text"
          id="nome_cliente"
          name="nome_cliente"
          value="{{ usuario.nome_cliente }}"
          required
        />

        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ usuario.email }}"
          required
        />

        <label for="data_nascimento">Data de Nascimento:</label>
        <input
          type="date"
          id="data_nascimento"
          name="data_nascimento"
          value="{{ usuario.data_nascimento }}"
          required
        />

        <label for="telefone">Telefone:</label>
        <input
          type="text"
          id="telefone"
          name="telefone"
          value="{{ usuario.telefone }}"
          required
        />

        <button type="submit">Salvar Alterações</button>
      </form>
    </div>


    <script>
      // Intercepta o envio do formulário para exibir o alerta após sucesso
      const form = document.getElementById("formEditar");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const formData = new FormData(form);
        fetch(form.action, {
          method: "POST",
          body: formData,
        })
          .then((response) => {
            if (response.redirected) {
              alert("✅ Dados editados com sucesso!");
              window.location.href = response.url;
            } else {
              alert("❌ Ocorreu um erro ao editar os dados.");
            }
          })
          .catch(() => {
            alert("❌ Erro de conexão ao enviar os dados.");
          });
      });
    </script>
  </body>
</html>
