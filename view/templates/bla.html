<script>
    // Verifica se o documento ainda está sendo carregado
    if (document.readyState === "loading") {
        // Se sim, adiciona um evento para rodar a função "ready" quando o DOM estiver pronto
        document.addEventListener("DOMContentLoaded", ready);
    } else {
        // Caso o documento já tenha sido carregado, executa a função imediatamente
        ready();
    }

    // Variável global para guardar o valor total da compra
    let totalAmount = 0;

    // Função que é executada quando o site termina de carregar
    function ready() {
        loadCartFromLocalStorage(); // Carrega os produtos salvos no carrinho (localStorage)

        // Pega o botão de pagamento pelo ID
        const purchaseButton = document.getElementById("botao-pagamento");

        // Se o botão existir na página, adiciona o evento de clique
        if (purchaseButton) {
            purchaseButton.addEventListener("click", makePurchase);
        }
    }

    // ================================
    // CARREGA CARRINHO DO LOCALSTORAGE
    // ================================
    function loadCartFromLocalStorage() {
        // Pega o carrinho do localStorage (ou cria um array vazio se não existir)
        const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        // Seleciona o container onde os produtos serão exibidos
        const container = document.querySelector(".produto-vestido");

        // Seleciona o elemento onde aparece o total (obs: "spam" deveria ser "span")
        // Linha 44: Antigo: const totalElement = document.querySelector(".pedido-total h2 span");
        const totalElement = document.querySelector(".pedido-total h2 span:nth-child(2)");

        // Começa colocando o título "Carrinho de compras" no container
        container.innerHTML = "<h1>Carrinho de compras</h1>";

        // ✅ Adiciona o checkbox "Selecionar todos"
        const linhaSelecao = document.createElement("div");
        linhaSelecao.classList.add("linha-selecao");
        linhaSelecao.innerHTML = `
        <input id="selecionar-todos" type="checkbox" class="checkbox-geral" />
        <label for="selecionar-todos">Selecionar todos</label>
        `;
        container.appendChild(linhaSelecao);

        // Se o carrinho estiver vazio, mostra a mensagem e zera o total
        if (carrinho.length === 0) {
            container.innerHTML += "<p>Seu carrinho está vazio!</p>";
            totalElement.textContent = "0,00";
            return;
        }

        
        // Se o carrinho estiver vazio, mostra a mensagem e zera o total
        if (carrinho.length === 0) {
            container.innerHTML += "<p>Seu carrinho está vazio!</p>";
            totalElement.textContent = "0,00";
            return; // Sai da função
        }

        // Para cada produto no carrinho...
        carrinho.forEach((produto, index) => {
            // Cria uma nova div para representar o produto
            const div = document.createElement("div");
            div.classList.add("produto-item"); // adiciona a classe CSS

            // Adiciona dentro da div as informações do produto
            div.innerHTML = `
            <input class="checkbox-item" type="checkbox">
            <img class="foto" src="${produto.imagem}" alt="${produto.nome}"> <!-- imagem do produto -->
            <div class="texto">
            <h3>${produto.nome}</h3> <!-- nome do produto -->
            <img class="lixeira" src="/static/img_home/lixeira.png" alt="lixeira" data-index="${index}"><!-- botão para excluir o produto -->
            <br>
            <label class="tamanho-label">Tamanho:</label>
            <!-- seletor de tamanhos -->
            <select class="tamanho">
                <option value="PP" ${produto.tamanho === "PP" ? "selected" : ""}>PP</option>
                <option value="P" ${produto.tamanho === "P" ? "selected" : ""}>P</option>
                <option value="M" ${produto.tamanho === "M" ? "selected" : ""}>M</option>
                <option value="G" ${produto.tamanho === "G" ? "selected" : ""}>G</option>
                <option value="GG" ${produto.tamanho === "GG" ? "selected" : ""}>GG</option>
            </select>
            <br>
            <label class="quantidade">Quantidade:</label>
            <!-- campo para alterar a quantidade -->
            <input type="number" class="quantia" min="1" max="10" value="${produto.quantidade}">
            <!-- mostra o preço -->
            <p class="valor">${produto.preco}</p>
            </div>
        `;
            // adiciona a div do produto no container
            container.appendChild(div);
        });

        // Atualiza o valor total dos produtos
        updateTotal();

        // Adiciona eventos para quando a quantidade for alterada
        document.querySelectorAll(".quantia").forEach(input => {
            input.addEventListener("change", updateQuantity);
        });

        // Adiciona eventos para quando clicar na lixeira (remover produto)
        document.querySelectorAll(".lixeira").forEach(btn => {
            btn.addEventListener("click", removeProduct);
        });

        // Adiciona eventos para quando mudar o tamanho
        document.querySelectorAll(".tamanho").forEach(select => {
            select.addEventListener("change", event => {
                // Pega o índice do produto que teve o tamanho alterado
                const index = Array.from(document.querySelectorAll(".tamanho")).indexOf(event.target);

                // Atualiza o tamanho no localStorage
                let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
                carrinho[index].tamanho = event.target.value;
                localStorage.setItem("carrinho", JSON.stringify(carrinho));
            });
        });
    }

    // ================================
      // ATUALIZA TOTAL DO CARRINHO
     // ================================
    function updateTotal() {
    const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    const totalElement = document.querySelector(".pedido-total h2 span:nth-child(2)");
    let total = 0;

    // Soma o preço de todos os produtos
    carrinho.forEach(produto => {
    // Converte o preço de "R$xx,xx" para número
    let preco = parseFloat(produto.preco.replace("R$", "").replace(".", "").replace(",", "."));
    total += preco * produto.quantidade;
    });

     // [LINHA 171] MUDANÇA AQUI: Adicionar style: 'currency' e currency: 'BRL'
    totalElement.textContent = total.toLocaleString("pt-BR", { 
            style: 'currency', 
            currency: 'BRL' 
        });

    // Guarda o total na variável global
     totalAmount = total;
     }

// ... (Resto do código) ...

    // ================================
    // ATUALIZA QUANTIDADE DE UM PRODUTO
    // ================================
    function updateQuantity(event) {
        // Pega o índice do produto alterado
        const index = Array.from(document.querySelectorAll(".quantia")).indexOf(event.target);

        // Pega o carrinho atual
        let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

        // Atualiza a quantidade com o novo valor
        carrinho[index].quantidade = parseInt(event.target.value) || 1;

        // Salva de volta no localStorage
        localStorage.setItem("carrinho", JSON.stringify(carrinho));

        // Recalcula o total
        updateTotal();
    }

    // ================================
    // REMOVE UM PRODUTO DO CARRINHO
    // ================================
    function removeProduct(event) {
    const btn = event.target;
    const index = parseInt(btn.dataset.index);

    if (isNaN(index)) return; // segurança extra

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
    carrinho.splice(index, 1);
    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    loadCartFromLocalStorage(); // recarrega o carrinho
    }


    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
        return null;
        }
    
    // ================================
    // FINALIZA A COMPRA (ENVIA AO BACKEND)
    // ================================
    async function makePurchase(event) {
        event.preventDefault(); // evita o comportamento padrão do <form>
        
        const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
        
        if (carrinho.length === 0) {
            alert("Seu carrinho está vazio!");
            return;
        }
    
        // Monta o payload do pedido
        const pedidoData = {
          valor_total: totalAmount, // totalAmount deve ser um número
          itens_pedido: carrinho.map(item => ({
            id_produto: Number(item.id),
            tamanho: item.tamanho,
            quantidade: Number(item.quantidade),
            preco_unitario: parseFloat(
              item.preco.replace("R$", "").replace(".", "").replace(",", ".")
            ),
            subtotal:
              parseFloat(
                item.preco.replace("R$", "").replace(".", "").replace(",", ".")
              ) * Number(item.quantidade)
          }))
        };
    
        try {
            const response = await fetch("/pedido/salvar", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(pedidoData),
                credentials: "include"
            });
        
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || "Erro ao criar o pedido");
            }
        
            const data = await response.json();
            console.log("Pedido salvo com sucesso:", data);
        
            alert(`✅ Pedido realizado com sucesso! Número do pedido: ${data.pedido_id}`);
        
            // Limpa o carrinho e atualiza tela
            localStorage.removeItem("carrinho");
            loadCartFromLocalStorage();
        } catch (err) {
            console.error("Erro ao enviar pedido:", err);
            alert("❌ Não foi possível concluir o pedido. Tente novamente.");
        }
    }

</script>
