<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SOB Véu</title>
    <link rel="stylesheet" href="/static/css/cadastro_usuario.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Cadastre-se</h1>
            <p class="subtitle">Crie sua conta para começar</p>
            
            <form action="/usuario/registrar" method="POST">
                <div class="form-section">
                    <h2>Dados Pessoais</h2>
                    
                    <div class="form-group">
                        <label for="nome_cliente">Nome Completo</label>
                        <input type="text" id="nome_cliente" name="nome_cliente" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="data_nascimento">Data de Nascimento</label>
                            <input type="date" id="data_nascimento" name="data_nascimento" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="00 00000 0000" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Dados de Acesso</h2>
                    
                    <div class="form-group">
                        <label for="nome_usuario">Nome de Usuário</label>
                        <input type="text" id="nome_usuario" name="nome_usuario" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Endereço</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" name="estado" maxlength="2" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" name="bairro" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group flex-2">
                            <label for="rua">Rua</label>
                            <input type="text" id="rua" name="rua" required>
                        </div>
                        
                        <div class="form-group flex-1">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="complemento">Complemento (opcional)</label>
                        <input type="text" id="complemento" name="complemento">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">Cadastrar</button>
                
                <div class="links">
                    <a href="/usuario/login">Já tem uma conta? Entre aqui</a>
                </div>
            </form>
        </div>
        
        <footer>
            <p>© 2025 SOB Véu. Todos os direitos reservados.</p>
        </footer>
    </div>
</body>
</html>
