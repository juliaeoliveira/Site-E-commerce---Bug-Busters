<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <link rel="stylesheet" href="/static/css/cadastro_usuario.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aboreto&family=Afacad:ital,wght@0,400..700;1,400..700&family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&family=Jim+Nightshade&family=Judson:ital,wght@0,400;0,700;1,400&family=Junge&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>

    <!-- MENU FIXO RESPONSIVO -->
    <header class="menu">
      <a href="/">
        <img id="logo" src="/static/img_home/Sob.png" alt="Logo" />
      </a>

      <button class="hamburger" id="hamburger" aria-label="Abrir menu">☰</button>

      <nav class="text-menu" id="nav-menu">
        <a href="/produtos">Vestidos</a>
        <a href="/colecoes">Coleções</a>
        <a href="/#Agendamentos">Agendamentos</a>
      </nav>

      <nav class="icons">
        <a href="/usuario/login">
          <img src="/static/img_home/login.png" title="login" alt="login" />
        </a>
        <a href="/painel_usuario/carrinho">
          <img id="icone-carrinho" src="/static/img_home/carrinho.png" title="Carrinho" alt="Carrinho" />
        </a>
      </nav>
    </header>

    <div class="overlay" id="overlay"></div>

    <main>
      <!-- COLUNA ESQUERDA: imagem de fundo + botão voltar -->
      <div class="lado-imagem">
        <div class="voltar-login">
          <a href="/usuario/login">
            <button class="ver">← Voltar ao Login</button>
          </a>
        </div>
      </div>

      <!-- COLUNA DIREITA: formulário -->
      <div class="lado-formulario">
        <form action="/usuario/registrar" method="post" id="formCadastro">

          <h1 class="titulo_cadastro">CADASTRO DE USUÁRIO</h1>
          <p class="subtitulo_cadastro">Preencha os dados abaixo para criar sua conta</p>

          <!-- ── SEÇÃO 1: Dados pessoais ── -->
          <div class="card-secao">
            <p class="secao-titulo">Dados Pessoais</p>
            <div class="form-grid">

              <div class="campo campo-full">
                <label for="Nome">Nome completo <span class="obrigatorio">*</span></label>
                <input
                  type="text"
                  id="Nome"
                  name="nome_cliente"
                  required
                  placeholder="Digite seu nome completo"
                />
              </div>

              <div class="campo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="seu.email@exemplo.com"
                />
              </div>

              <div class="campo">
                <label for="Telefone">Telefone <span class="obrigatorio">*</span></label>
                <input
                  type="tel"
                  id="Telefone"
                  name="telefone"
                  required
                  placeholder="(11) 99999-9999"
                />
              </div>

              <div class="campo">
                <label for="data_nascimento">Data de Nascimento <span class="obrigatorio">*</span></label>
                <input
                  type="date"
                  id="data_nascimento"
                  name="data_nascimento"
                  required
                />
              </div>

            </div>
          </div>

          <!-- ── SEÇÃO 2: Senha ── -->
          <div class="card-secao">
            <p class="secao-titulo">Senha de Acesso</p>
            <div class="form-grid">

              <div class="campo">
                <label for="senha">Senha <span class="obrigatorio">*</span></label>
                <input
                  type="password"
                  id="senha"
                  name="senha"
                  required
                  placeholder="Mínimo 8 caracteres"
                />
                <span class="hint-senha">Use letras maiúsculas, minúsculas, números e símbolos.</span>
                <p id="mensagem_erro" style="color:#c0392b"></p>
              </div>

              <div class="campo">
                <label for="confirmacao_senha">Confirmação de senha <span class="obrigatorio">*</span></label>
                <input
                  type="password"
                  id="confirmacao_senha"
                  name="confirmar_senha"
                  required
                  placeholder="Digite a senha novamente"
                />
              </div>

            </div>
          </div>

          <!-- ── SEÇÃO 3: Endereço ── -->
          <div class="card-secao">
            <p class="secao-titulo">Endereço</p>
            <div class="form-grid">

              <div class="campo">
                <label for="cep">CEP <span class="obrigatorio">*</span></label>
                <input
                  type="text"
                  id="cep"
                  name="cep"
                  required
                  placeholder="00000-000"
                  pattern="\d{5}-\d{3}"
                  title="Digite o CEP no formato: XXXXX-XXX"
                />
                <p id="mensagem_cep" style="color:red"></p>
              </div>

              <div class="campo">
                <label for="numero">Número <span class="obrigatorio">*</span></label>
                <input
                  type="number"
                  id="numero"
                  name="numero"
                  required
                  placeholder="123"
                  min="1"
                />
              </div>

              <div class="campo campo-full">
                <label for="rua">Rua <span class="obrigatorio">*</span></label>
                <input
                  type="text"
                  id="rua"
                  name="rua"
                  required
                  placeholder="Nome da rua, avenida, etc."
                />
              </div>

              <div class="campo">
                <label for="bairro">Bairro <span class="obrigatorio">*</span></label>
                <input
                  type="text"
                  id="bairro"
                  name="bairro"
                  required
                  placeholder="Nome do bairro"
                />
              </div>

              <div class="campo">
                <label for="complemento">Complemento <span style="color:#8a7050;font-weight:400">(opcional)</span></label>
                <input
                  type="text"
                  id="complemento"
                  placeholder="Apto 123, Bloco B, Casa, etc."
                />
              </div>

              <div class="campo">
                <label for="estado">Estado (UF) <span class="obrigatorio">*</span></label>
                <select id="estado" name="estado" required>
                  <option value="" disabled selected>Selecione um estado</option>
                  <option value="AC">Acre</option>
                  <option value="AL">Alagoas</option>
                  <option value="AP">Amapá</option>
                  <option value="AM">Amazonas</option>
                  <option value="BA">Bahia</option>
                  <option value="CE">Ceará</option>
                  <option value="DF">Distrito Federal</option>
                  <option value="ES">Espírito Santo</option>
                  <option value="GO">Goiás</option>
                  <option value="MA">Maranhão</option>
                  <option value="MT">Mato Grosso</option>
                  <option value="MS">Mato Grosso do Sul</option>
                  <option value="MG">Minas Gerais</option>
                  <option value="PA">Pará</option>
                  <option value="PB">Paraíba</option>
                  <option value="PR">Paraná</option>
                  <option value="PE">Pernambuco</option>
                  <option value="PI">Piauí</option>
                  <option value="RJ">Rio de Janeiro</option>
                  <option value="RN">Rio Grande do Norte</option>
                  <option value="RS">Rio Grande do Sul</option>
                  <option value="RO">Rondônia</option>
                  <option value="RR">Roraima</option>
                  <option value="SC">Santa Catarina</option>
                  <option value="SP">São Paulo</option>
                  <option value="SE">Sergipe</option>
                  <option value="TO">Tocantins</option>
                </select>
              </div>

              <div class="campo">
                <label for="cidade">Cidade <span class="obrigatorio">*</span></label>
                <input
                  type="text"
                  id="cidade"
                  name="cidade"
                  required
                  placeholder="Nome da cidade"
                />
              </div>

            </div>
          </div>

          <!-- BOTÃO -->
          <button class="btn-cadastrar" type="submit" id="acao">
            Criar Conta
          </button>

          <!-- Botão voltar: só aparece no mobile -->
          <!-- <div class="voltar-login-mobile">
            <a href="/usuario/login">
              <button type="button" class="ver">← Voltar ao Login</button>
            </a>
          </div> -->

        </form>
      </div>
    </main>

    <!-- ======== SCRIPTS (mantidos integralmente) ======== -->
    <script>
      const senha = document.getElementById("senha");
      const mensagem_erro = document.getElementById("mensagem_erro");

      senha.addEventListener("input", () => {
        const s = senha.value;
        let mensagens = [];
        if (s.length < 8) mensagens.push("Mínimo 8 caracteres.");
        if (!/[A-Z]/.test(s)) mensagens.push("Uma letra maiúscula.");
        if (!/[a-z]/.test(s)) mensagens.push("Uma letra minúscula.");
        if (!/[0-9]/.test(s)) mensagens.push("Um número.");
        if (!/[@#$%^&+=!-]/.test(s)) mensagens.push("Um caractere especial (@#$%^&+=!-).");
        if (/\s/.test(s)) mensagens.push("Sem espaços.");
        mensagem_erro.innerHTML = mensagens.length ? "⚠ " + mensagens.join(" · ") : "";
      });
    </script>

    <script>
      const cepInput = document.getElementById("cep");
      const mensagemCep = document.getElementById("mensagem_cep");
      const form = document.getElementById("formCadastro");

      function validarCEP(cep) {
        return /^\d{5}-\d{3}$/.test(cep);
      }

      cepInput.addEventListener("input", function (e) {
        let valor = e.target.value.replace(/\D/g, "");
        if (valor.length > 5) {
          valor = valor.substring(0, 5) + "-" + valor.substring(5, 8);
        } else if (valor.length === 5) {
          valor += "-";
        }
        e.target.value = valor;
        if (valor.length === 9 && validarCEP(valor)) {
          mensagemCep.textContent = "";
          buscarEnderecoPorCEP(valor);
        } else {
          mensagemCep.textContent = "";
        }
      });

      function buscarEnderecoPorCEP(cep) {
        const cepNumeros = cep.replace("-", "");
        fetch(`https://viacep.com.br/ws/${cepNumeros}/json/`)
          .then((r) => r.json())
          .then((data) => {
            if (!data.erro) {
              document.getElementById("rua").value = data.logradouro || "";
              document.getElementById("bairro").value = data.bairro || "";
              document.getElementById("cidade").value = data.localidade || "";
              document.getElementById("estado").value = data.uf || "";
            } else {
              mensagemCep.textContent = "CEP não encontrado.";
              mensagemCep.style.color = "red";
            }
          })
          .catch(() => {
            mensagemCep.textContent = "Erro ao validar CEP.";
            mensagemCep.style.color = "orange";
          });
      }

      cepInput.addEventListener("blur", function () {
        const cep = cepInput.value.trim();
        if (cep && !validarCEP(cep)) {
          mensagemCep.textContent = "Formato inválido. Use: XXXXX-XXX";
          mensagemCep.style.color = "red";
        } else if (cep && validarCEP(cep)) {
          buscarEnderecoPorCEP(cep);
        }
      });

      form.addEventListener("submit", function (e) {
        const cep = cepInput.value.trim();
        if (!validarCEP(cep)) {
          e.preventDefault();
          alert("❌ Formato de CEP inválido!\n\nUse: XXXXX-XXX\nExemplo: 08161-540");
          cepInput.focus();
          return false;
        }
        const s = document.getElementById("senha").value;
        const c = document.getElementById("confirmacao_senha").value;
        if (s !== c) {
          e.preventDefault();
          alert("❌ As senhas não coincidem!");
          document.getElementById("senha").focus();
          return false;
        }
        return true;
      });
    </script>

    <script>
      document.getElementById("Telefone").addEventListener("input", function (e) {
        let v = e.target.value.replace(/\D/g, "");
        if (v.length > 10) {
          v = "(" + v.substring(0,2) + ") " + v.substring(2,7) + "-" + v.substring(7,11);
        } else if (v.length > 6) {
          v = "(" + v.substring(0,2) + ") " + v.substring(2,6) + "-" + v.substring(6,10);
        } else if (v.length > 2) {
          v = "(" + v.substring(0,2) + ") " + v.substring(2);
        } else if (v.length > 0) {
          v = "(" + v;
        }
        e.target.value = v;
      });
    </script>

    <script>
      const nav = document.getElementById("nav-menu");
      const btn = document.getElementById("hamburger");
      const overlay = document.getElementById("overlay");

      function openMenu() {
        nav.classList.add("active");
        overlay.classList.add("active");
        document.body.style.overflow = "hidden";
      }
      function closeMenu() {
        nav.classList.remove("active");
        overlay.classList.remove("active");
        document.body.style.overflow = "";
      }

      btn.addEventListener("click", () => {
        nav.classList.contains("active") ? closeMenu() : openMenu();
      });
      overlay.addEventListener("click", closeMenu);
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
    </script>

  </body>
</html>
