<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/css/cadastro_usuario.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="menu">
        <a href="/"><img id="logo"src="/static/img_home/Sob.png" alt="Logo"></a>
            <nav>
                <a href="/produtos/">Vestidos</a>
                <a href="#Colecoes">Coleções</a>
                <a href="/#Agendamentos">Agendamentos</a>
            </nav>
            <nav class="icons">
                <a href="/usuario/login">
                        <img src="/static/img_home/login.png"
                        width="20px"
                        title="login"
                        alt="login"
                    />
                    </a>
                <a href="/carrinho/">
                    <img src="/static/img_home/carrinho.png"
                    width="20px"
                    title="Carrinho"
                    alt="Carrinho"
                />
                </a>
            </nav>
        </div>
    <main>
        <form action="/usuario/registrar" method="post">
            <section class="cadastro">
                <h1 class="titulo_cadastro">CADASTRO DE USUÁRIO</h1>
                <div class="informacoes">
                    <label for="Nome">Nome completo:</label>
                    <input class="posicao" type="text" id="Nome" name="nome_cliente" required placeholder="Ex: João Martins Souza" />
         
                    <!-- Agrupamento lado a lado -->
                    <div class="senhas">
                      <div>
                        <label for="senha">Senha:</label>
                        <input class="posicao" type="password" id="senha" name="senha" required placeholder="Crie uma senha segura" />

                          <!-- Aqui vai aparecer as mensagens -->
                          <p id="mensagem_erro" style="color:red;"></p>
                        </div>
                      </div>
                      <label for="confirmacao_senha">Confirmação de senha:</label>
                      <input class="posicao" type="password" id="confirmacao_senha" name="confirmar_senha" required placeholder="Confirme a senha" />
               
                    <label for="email">E-mail:</label>
                    <input class="posicao" type="email" id="email" name="email" required placeholder="Digite seu e-mail" />

                    <label for="data_nascimento">Data de Nascimento:</label>
                    <input class="posicao" type="date" id="data_nascimento" name="data_nascimento" required />
          

                    <label for="Telefone">Telefone:</label>
                    <input class="posicao" type="tel" id="Telefone" name="telefone" required placeholder="Informe seu telefone com DDD" />

                    <button class="cadastrar" type="submit" id="acao">Criar conta</button>
                </div>
            </section>
        </form>
        <div class="outrosvestidos">
           <a href="/"><button class="ver"> ← Voltar à página inicial</button></a>
       </div> 
    </main>

    <p id="mensagem_erro" style="color:red;"></p>

<script>
const senha = document.getElementById('senha');
const mensagem_erro = document.getElementById('mensagem_erro');

senha.addEventListener('input', () => {
    const s = senha.value;
    let mensagens = [];

    if (s.length < 8) mensagens.push("A senha deve ter pelo menos 8 caracteres.");
    if (!/[A-Z]/.test(s)) mensagens.push("A senha deve conter pelo menos uma letra maiúscula.");
    if (!/[a-z]/.test(s)) mensagens.push("A senha deve conter pelo menos uma letra minúscula.");
    if (!/[0-9]/.test(s)) mensagens.push("A senha deve conter pelo menos um número.");
    if (!/[@#$%^&+=!-]/.test(s)) mensagens.push("A senha deve conter pelo menos um caractere especial (@#$%^&+=!-).");
    if (/\s/.test(s)) mensagens.push("A senha não pode conter espaços.");

    // Se todas as regras forem cumpridas, a mensagem some
    mensagem_erro.innerHTML = mensagens.length ? mensagens.join("<br>") : "";
});
</script>

<script>
const cep = document.getElementById('cep');
const mensagem_cep = document.getElementById('mensagem_cep');

cep.addEventListener('input', () => {
    const valor = cep.value;

    // Regex que aceita 12345678 ou 12345-678
    const regex = /^\d{5}-?\d{3}$/;

    if (valor === "" || regex.test(valor)) {
        // CEP válido ou campo vazio → sem mensagem
        mensagem_cep.textContent = "";
    } else {
        // CEP inválido
        mensagem_cep.textContent = "CEP inválido.";
    }
});
</script>


</body>
</html>
